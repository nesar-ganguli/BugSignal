services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bugsignal
      POSTGRES_USER: bugsignal
      POSTGRES_PASSWORD: bugsignal_local
    ports:
      - "5432:5432"
    volumes:
      - bugsignal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugsignal -d bugsignal"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - bugsignal_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bugsignal_postgres_data:
  bugsignal_redis_data:
